name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install
        run: python -m pip install -e .
      - name: unit and schema tests
        run: python -m unittest discover -s tests -v
      - name: manifest conformance
        run: python scripts/run_conformance.py
      - name: public release scan
        run: python scripts/release_scan.py .
      - name: shell release scan wrapper
        if: runner.os == 'Linux'
        run: sh scripts/release-scan.sh .
